name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[browser,dev]"
      - name: Full unittest suite
        run: python -m unittest discover -s tests
      - name: Lifecycle tests
        run: python -m unittest discover -s tests -p 'test_product_lifecycle.py'
      - name: V2 tests
        run: python -m unittest discover -s tests -p 'test_v2.py'
      - name: Runtime hygiene tests
        run: python -m unittest discover -s tests -p 'test_runtime_hygiene.py'
      - name: Wheel and entrypoint smoke
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m pip wheel . -w "$tmpdir" --no-deps
          python -m venv "$tmpdir/venv"
          env -u PYTHONPATH "$tmpdir/venv/bin/python" -m pip install --force-reinstall "$tmpdir"/*.whl
          env -u PYTHONPATH "$tmpdir/venv/bin/codex-bridge" --help >/dev/null
          env -u PYTHONPATH "$tmpdir/venv/bin/bridgectl" --help >/dev/null
          env -u PYTHONPATH BRIDGE_HOME="$tmpdir/bridge-home" "$tmpdir/venv/bin/codex-bridge" self-test --json
          env -u PYTHONPATH BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/venv/bin/codex-bridge" install --json
          env -u PYTHONPATH BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/venv/bin/codex-bridge" doctor --json
          env -u PYTHONPATH BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/venv/bin/codex-bridge" snapshot --json
          env -u PYTHONPATH BRIDGE_HOME="$tmpdir/bridge-home" "$tmpdir/venv/bin/codex-bridge" uninstall --json
      - name: Installer script dry-run smoke
        run: ./scripts/install.sh --dry-run --json
      - name: Installer script real fallback smoke
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python_bin="$(command -v python)"
          mkdir -p "$tmpdir/bin"
          ln -s "$python_bin" "$tmpdir/bin/python"
          ln -s "$python_bin" "$tmpdir/bin/python3"
          PATH="$tmpdir/bin:/usr/bin:/bin" BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" ./scripts/install.sh --profile browser-extra --json
          test ! -e .venv
          BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/bridge-home/install/venv/bin/codex-bridge" doctor --json
          BRIDGE_HOME="$tmpdir/bridge-home" "$tmpdir/bridge-home/install/venv/bin/codex-bridge" uninstall --json
          rm -rf "$tmpdir"
      - name: Installer script uv smoke
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/uv-runner"
          "$tmpdir/uv-runner/bin/python" -m pip install uv
          PATH="$tmpdir/uv-runner/bin:$PATH" UV_TOOL_DIR="$tmpdir/uv-tools" UV_TOOL_BIN_DIR="$tmpdir/uv-bin" BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" ./scripts/install.sh --profile browser-extra --json
          BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/uv-bin/codex-bridge" doctor --json
          BRIDGE_HOME="$tmpdir/bridge-home" "$tmpdir/uv-bin/codex-bridge" uninstall --json
          rm -rf "$tmpdir"
