name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  release-gate:
    name: Release gate - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Full unittest suite
        run: python -m unittest discover -s tests

  build-release-artifacts:
    name: Build release artifacts
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Build wheel, sdist, source archive, and checksums
        run: sh scripts/build_release_artifacts.sh
      - name: Release artifact install smoke
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          python -m venv "$tmpdir/venv"
          "$tmpdir/venv/bin/python" -m pip install dist/chatgpt_codex_bridge-*.whl
          "$tmpdir/venv/bin/codex-bridge" --help >/dev/null
          "$tmpdir/venv/bin/bridgectl" --help >/dev/null
          BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/venv/bin/codex-bridge" install --json
          BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/venv/bin/codex-bridge" self-test --json
          BRIDGE_HOME="$tmpdir/bridge-home" CODEX_HOME="$tmpdir/codex-home" "$tmpdir/venv/bin/codex-bridge" doctor --json
          BRIDGE_HOME="$tmpdir/bridge-home" "$tmpdir/venv/bin/codex-bridge" uninstall --json
          rm -rf "$tmpdir"
      - name: Write checksums
        run: (cd dist && shasum -a 256 -c SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" --notes-file CHANGELOG.md
